name: Finalize v0.21.9 release

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/finalize-v0219-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ea9d86d4ba30dff807286e9b5094e9ceee8f2523
          fetch-depth: 0

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/KimsufiStockCommander-v0.21.9
          rsync -a --exclude '.git' --exclude 'dist' ./ dist/KimsufiStockCommander-v0.21.9/
          (cd dist && zip -qr KimsufiStockCommander-v0.21.9.zip KimsufiStockCommander-v0.21.9)

          mkdir -p dist/KimsufiTray-Remote-v0.21.9
          cp KimsufiTray.ps1 start-tray.cmd generate-api-token.ps1 dist/KimsufiTray-Remote-v0.21.9/
          cp KimsufiTray.remote-auth-example.json dist/KimsufiTray-Remote-v0.21.9/KimsufiTray.json
          cat > dist/KimsufiTray-Remote-v0.21.9/README.txt <<'EOF'
          Kimsufi Tray Remote Client v0.21.9

          Default role: Read.
          Configure serverHost/serverPort in KimsufiTray.json and set KSC_READ_TOKEN.

          Privileged Tray actions support Admin step-up:
          - authorize only this operation, or
          - elevate the current Tray session to Admin.

          Session Admin state is memory-only and can be dropped back to Read.
          EOF
          (cd dist && zip -qr KimsufiTray-Remote-v0.21.9.zip KimsufiTray-Remote-v0.21.9)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Kimsufi Stock Commander v0.21.9

          v0.21.9 is the capability-based access-control and Tray step-up release.

          ### Read / Admin model

          - Separate `KSC_READ_TOKEN` and `KSC_ADMIN_TOKEN`.
          - Legacy `KSC_API_TOKEN` remains supported as an Admin-compatible fallback.
          - Backend capability checks enforce Read/Admin boundaries; UI changes cannot bypass them.
          - Read-mode privileged controls remain visible and are marked as Admin actions.
          - Web Admin step-up supports one-shot authorization or session elevation.
          - Session Admin can be explicitly dropped back to Read.

          ### Tray step-up and reliability

          - Remote Tray defaults to Read.
          - Admin actions can authorize only the current operation or elevate the current Tray session.
          - Session Admin tokens remain in process memory and are not written to JSON.
          - Native Windows shield UI replaces emoji fallback.
          - Windows PowerShell 5.1 scripts ship as UTF-8 with BOM.
          - Tray runtime networking is asynchronous, so a stalled/offline Commander does not freeze the WinForms UI.
          - Timeout, network failure, HTTP 401, HTTP 403 and server errors are reported separately.
          - Admin verification de-duplicates stale/late callbacks; only an explicit HTTP 401 is treated as an invalid token.
          - A per-Commander single-instance mutex prevents duplicate Tray instances and uses a safe hashed instance key.

          ### Token generation

          The default helper command generates both Read and Admin tokens and stores them in the current user's environment:

          ```powershell
          powershell -File .\generate-api-token.ps1
          ```

          ### Upgrade

          Existing `data/` can be retained. After upgrading the Web UI, use **Ctrl+F5** once.

          Authentication is still transport-independent: Bearer Tokens over plain HTTP are not encrypted. Use HTTPS or a trusted encrypted VPN/tunnel on untrusted networks.
          EOF

          if gh release view v0.21.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.21.9 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kimsufi Stock Commander v0.21.9" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create v0.21.9 \
              --repo "$GITHUB_REPOSITORY" \
              --target ea9d86d4ba30dff807286e9b5094e9ceee8f2523 \
              --title "Kimsufi Stock Commander v0.21.9" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

          gh release upload v0.21.9 \
            dist/KimsufiStockCommander-v0.21.9.zip \
            dist/KimsufiTray-Remote-v0.21.9.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
