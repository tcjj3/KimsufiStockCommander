name: Publish v0.19.0 assets v3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v019-assets-v3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.19.0
        uses: actions/checkout@v4
        with:
          ref: v0.19.0
          fetch-depth: 0

      - name: Build sanitized archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/kimsufi-stock-commander-v0.19

          cp .gitignore KimsufiServer.json KimsufiStockCommander.py KimsufiTray.json              KimsufiTray.ps1 KimsufiTray.remote-example.json MIGRATION.md README.md              install-autostart.ps1 start-demo.cmd start-live.cmd start-live.ps1              start-tray.cmd uninstall-autostart.ps1 dist/kimsufi-stock-commander-v0.19/
          cp -a legacy tests ui dist/kimsufi-stock-commander-v0.19/

          find dist/kimsufi-stock-commander-v0.19 -type f -print0             | xargs -0 sed -i 's/192\.168\.19\.1/192.0.2.10/g'

          mkdir -p dist/kimsufi-tray-remote-v0.19
          cp KimsufiTray.ps1 start-tray.cmd dist/kimsufi-tray-remote-v0.19/
          cp KimsufiTray.remote-example.json dist/kimsufi-tray-remote-v0.19/KimsufiTray.json
          sed -i 's/192\.168\.19\.1/192.0.2.10/g' dist/kimsufi-tray-remote-v0.19/KimsufiTray.json

          cat > dist/kimsufi-tray-remote-v0.19/README.txt <<'EOF'
          Kimsufi Tray Remote Client v0.19

          1. 编辑 KimsufiTray.json：
             serverHost = Commander 所在宿主机 IP（例如 192.0.2.10）
             serverPort = Commander Web/API 端口（默认 8765）
          2. 保持 startBackend=false、allowStopBackend=false。
          3. 双击 start-tray.cmd。

          这个包不包含 KimsufiStockCommander.py，因此不会启动或停止后端。
          Tray 离线时会保持驻留并自动重连。

          注意：Commander 若监听 0.0.0.0，建议用 Windows Firewall 只允许管理 VM/机器访问该端口。
          EOF

          if grep -RInE '(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})' dist; then
            echo "Private LAN address remains in release payload" >&2
            exit 1
          fi
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|[0-9]{6,12}:[A-Za-z0-9_-]{25,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' dist; then
            echo "Potential secret material remains in release payload" >&2
            exit 1
          fi

          (cd dist && zip -qr KimsufiStockCommander-v0.19.0.zip kimsufi-stock-commander-v0.19)
          (cd dist && zip -qr KimsufiTray-Remote-v0.19.0.zip kimsufi-tray-remote-v0.19)
          sha256sum dist/KimsufiStockCommander-v0.19.0.zip dist/KimsufiTray-Remote-v0.19.0.zip

      - name: Upload to v0.19.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.19.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v0.19.0             dist/KimsufiStockCommander-v0.19.0.zip             dist/KimsufiTray-Remote-v0.19.0.zip             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.19.0 --repo "$GITHUB_REPOSITORY" --json assets             --jq '.assets[].name' | sort | tee /tmp/assets.txt
          grep -Fx 'KimsufiStockCommander-v0.19.0.zip' /tmp/assets.txt
          grep -Fx 'KimsufiTray-Remote-v0.19.0.zip' /tmp/assets.txt
